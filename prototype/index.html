<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SpringBoard</title>
<link rel="stylesheet" href="css/ui.css">
</head>
<body>

<!-- ===== ikon sprite (SVG 1.1, iOS 6 uyumlu) ===== -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="sprite" aria-hidden="true">
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
  <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><polyline points="22,6 12,13 2,6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h8M8 17h5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><polyline points="12 6 12 12 16 14"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.9-4.9"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M5 12.5a11 11 0 0 1 14 0M8.5 16a6 6 0 0 1 7 0M12 19.5h.01"/></symbol>
  <symbol id="i-bluetooth" viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></symbol>
  <symbol id="i-airplane" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></symbol>
  <symbol id="i-cellular" viewBox="0 0 24 24"><path d="M2 20h3v-4H2zM8 20h3v-8H8zM14 20h3V8h-3zM20 20h3V4h-3z"/></symbol>
  <symbol id="i-flash" viewBox="0 0 24 24"><path d="M13 2 3 14h8l-1 8 10-12h-8l1-8z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
  <symbol id="i-mirror" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="12" r="4"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><path d="M19 5v14"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><path d="M5 19V5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-appstore" viewBox="0 0 24 24"><path d="M12 3v18M4.5 7.5l15 9M19.5 7.5l-15 9"/></symbol>
  <symbol id="i-battery" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2.5"/><path d="M22 11v2"/></symbol>
</svg>

<div class="stage" id="stage">

  <div class="wallpaper">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <!-- durum çubuğu -->
  <div class="statusbar">
    <div class="sb-left"><span id="sb-clock">9:41</span></div>
    <div class="sb-right">
      <svg class="sb-ico" viewBox="0 0 24 24"><use xlink:href="#i-cellular"/></svg>
      <svg class="sb-ico" viewBox="0 0 24 24"><use xlink:href="#i-wifi"/></svg>
      <span class="sb-battery"><i></i></span>
    </div>
  </div>

  <!-- sayfalar -->
  <div class="pages" id="pages">
    <div class="track" id="track">
      <div class="page" id="page1"></div>
      <div class="page" id="page2"></div>
    </div>
  </div>

  <!-- arama kapsülü -->
  <div class="searchpill" id="searchpill">
    <svg class="sp-ico" viewBox="0 0 24 24"><use xlink:href="#i-search"/></svg>
    <span>Ara</span>
  </div>

  <!-- dock -->
  <div class="dock" id="dock"></div>

  <!-- arama katmanı -->
  <div class="overlay search-overlay" id="searchOverlay">
    <div class="search-bar">
      <svg class="sp-ico" viewBox="0 0 24 24"><use xlink:href="#i-search"/></svg>
      <input id="searchInput" type="text" placeholder="Uygulama ara" autocomplete="off">
      <div class="cancel" id="searchCancel">İptal</div>
    </div>
    <div class="results" id="results"></div>
  </div>

  <!-- kontrol merkezi -->
  <div class="overlay cc-overlay" id="ccOverlay">
    <div class="cc">
      <div class="cc-grid">
        <div class="cc-module conn">
          <div class="cc-row">
            <button class="cc-btn" data-toggle><svg viewBox="0 0 24 24"><use xlink:href="#i-airplane"/></svg></button>
            <button class="cc-btn" data-toggle><svg viewBox="0 0 24 24"><use xlink:href="#i-cellular"/></svg></button>
            <button class="cc-btn on" data-toggle><svg viewBox="0 0 24 24"><use xlink:href="#i-wifi"/></svg></button>
            <button class="cc-btn" data-toggle><svg viewBox="0 0 24 24"><use xlink:href="#i-bluetooth"/></svg></button>
          </div>
        </div>
        <div class="cc-module music">
          <div class="cc-track">Şu an çalan yok</div>
          <div class="cc-controls">
            <button class="cc-mini"><svg viewBox="0 0 24 24"><use xlink:href="#i-prev"/></svg></button>
            <button class="cc-mini big"><svg viewBox="0 0 24 24"><use xlink:href="#i-play"/></svg></button>
            <button class="cc-mini"><svg viewBox="0 0 24 24"><use xlink:href="#i-next"/></svg></button>
          </div>
        </div>
        <div class="cc-module tall">
          <button class="cc-btn" data-toggle><svg viewBox="0 0 24 24"><use xlink:href="#i-flash"/></svg></button>
          <button class="cc-btn" data-toggle><svg viewBox="0 0 24 24"><use xlink:href="#i-mirror"/></svg></button>
          <button class="cc-btn" data-toggle><svg viewBox="0 0 24 24"><use xlink:href="#i-timer"/></svg></button>
          <button class="cc-btn" data-toggle><svg viewBox="0 0 24 24"><use xlink:href="#i-moon"/></svg></button>
        </div>
        <div class="cc-module slider">
          <div class="slider-label">Parlaklık</div>
          <div class="slider-track"><i style="width:70%"></i></div>
        </div>
        <div class="cc-module slider">
          <div class="slider-label">Ses</div>
          <div class="slider-track"><i style="width:45%"></i></div>
        </div>
      </div>
      <div class="cc-grab"></div>
    </div>
  </div>

  <!-- uygulama açılış katmanı -->
  <div class="overlay app-overlay" id="appOverlay">
    <div class="app-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title" id="sheetTitle">Uygulama</div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

</div>

<script src="js/ui.js"></script>
</body>
</html>
